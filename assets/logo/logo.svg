<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient für modernes Aussehen -->
    <linearGradient id="agileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#009688;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00695C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4DB6AC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hintergrund-Kreis (Sprint-Symbol) -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#agileGradient)" stroke-width="24" stroke-linecap="round" stroke-dasharray="1200 300" transform="rotate(-45 256 256)"/>
  
  <!-- Äußerer Ring (Iteration/Cycle) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#aiGradient)" stroke-width="8" stroke-linecap="round" stroke-dasharray="400 200" opacity="0.6" transform="rotate(60 256 256)"/>
  
  <!-- Stilisiertes "A" für Agile/AI -->
  <g transform="translate(256, 280)">
    <!-- Linker Schenkel -->
    <path d="M-80,80 L0,-120 L20,-80" fill="none" stroke="url(#agileGradient)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Rechter Schenkel -->
    <path d="M80,80 L0,-120 L-20,-80" fill="none" stroke="url(#agileGradient)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Querbalken -->
    <path d="M-45,20 L45,20" fill="none" stroke="url(#aiGradient)" stroke-width="20" stroke-linecap="round"/>
  </g>
  
  <!-- AI-Punkt (Neural Network Node) -->
  <circle cx="256" cy="160" r="24" fill="url(#aiGradient)"/>
  
  <!-- Kleine Punkte (Verbindungen) -->
  <circle cx="176" cy="340" r="10" fill="#4DB6AC" opacity="0.8"/>
  <circle cx="336" cy="340" r="10" fill="#4DB6AC" opacity="0.8"/>
</svg>
